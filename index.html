<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PY-CURITY | Control ESP32 MQTT</title>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        /* (Estilos intactos) */
        * { box-sizing: border-box; }

        @keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes float { 0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.7; } 50% { transform: translateY(-40px) translateX(20px) rotate(180deg); opacity: 1; } 100% { transform: translateY(0) translateX(0) rotate(360deg); opacity: 0.7; } }
        @keyframes glowPulse { 0%, 100% { text-shadow: 0 0 10px #ff00e6, 0 0 20px #ff00e6, 0 0 40px #00f0ff; } 50% { text-shadow: 0 0 20px #00f0ff, 0 0 40px #ff00e6, 0 0 60px #fff700; } }
        @keyframes titleGlow { 0%, 100% { text-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 60px #7000ff; } 50% { text-shadow: 0 0 25px #fff700, 0 0 50px #ff00e6, 0 0 80px #00f0ff; } }
        @keyframes borderSpin { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        @keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes bulbGlow { 0%, 100% { filter: drop-shadow(0 0 12px #fff700) drop-shadow(0 0 25px #fff700); } 50% { filter: drop-shadow(0 0 22px #fff700) drop-shadow(0 0 45px #ffae00); } }

        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; position: relative; background: linear-gradient(rgba(3, 10, 16, 0.82), rgba(3, 10, 16, 0.92)), url("https://images.unsplash.com/photo-1571068316344-75bc76f77890?auto=format&fit=crop&w=2000&q=85") center/cover fixed; background-size: cover; animation: bgShift 12s ease infinite; color: white; padding: 20px; }
        .particle { position: fixed; border-radius: 50%; filter: blur(1px); pointer-events: none; animation: float 8s ease-in-out infinite; z-index: 0; }
        #appTitle { position: relative; z-index: 2; font-size: clamp(64px, 11vw, 120px); font-weight: 900; letter-spacing: 10px; margin: 0 0 8px 0; background: linear-gradient(90deg, #00f0ff, #ff00e6, #fff700, #00f0ff); background-size: 300% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: titleGlow 3s ease-in-out infinite, bgShift 5s linear infinite; }
        #appSubtitle { position: relative; z-index: 2; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.75; margin: 0 0 25px 0; }
        
        #loginOverlay { position: fixed; inset: 0; background: rgba(5, 5, 15, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 10; }
        .loginBox { background: rgba(10, 10, 20, 0.7); border-radius: 22px; padding: 40px 30px; width: 280px; text-align: center; }
        .loginBox h2 { margin-top: 0; text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }
        .loginBox input { width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 6px; border-radius: 10px; border: none; margin: 15px 0; outline: none; }
        .loginBox button { width: 100%; height: 50px; font-size: 17px; border-radius: 10px; border: none; background: linear-gradient(135deg, #00ffb3, #00c2ff); box-shadow: 0 0 15px #00ffb3; color: white; font-weight: bold; cursor: pointer; }
        #loginError { color: #ff4d6d; font-size: 13px; min-height: 18px; margin-top: 5px; }

        .card { position: relative; background: rgba(10, 10, 20, 0.55); border-radius: 26px; padding: 40px 35px; width: 340px; backdrop-filter: blur(10px); z-index: 2; }
        .card::before { content: ""; position: absolute; inset: -3px; border-radius: 28px; padding: 3px; background: conic-gradient(from 0deg, #ff00e6, #00f0ff, #fff700, #7000ff, #ff00e6); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: borderSpin 4s linear infinite; z-index: -1; }
        h1 { font-size: 24px; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; animation: glowPulse 2.5s ease-in-out infinite; }
        
        #bombillo { width: 90px; height: 90px; margin: 15px auto 20px; transition: filter 0.3s ease; }
        #bombillo.apagado { filter: drop-shadow(0 0 4px rgba(255,255,255,0.2)); }
        #bombillo.encendido { animation: bulbGlow 1.6s ease-in-out infinite; }
        #bombillo .vidrio { transition: fill 0.3s ease; }

        button { width: 230px; height: 65px; font-size: 20px; font-weight: bold; margin: 10px 0; border-radius: 16px; border: none; cursor: pointer; color: white; letter-spacing: 1px; transition: transform 0.15s ease; animation: btnPulse 2s ease-in-out infinite; }
        button:hover { transform: scale(1.08) !important; }
        button:active { transform: scale(0.96) !important; }
        .on { background: linear-gradient(135deg, #00ffb3, #00c2ff); box-shadow: 0 0 20px #00ffb3, 0 0 40px #00c2ff; }
        .off { background: linear-gradient(135deg, #ff0066, #ff9500); box-shadow: 0 0 20px #ff0066, 0 0 40px #ff9500; }
        #estado { margin-top: 20px; font-size: 16px; font-weight: bold; color: #fff700; text-shadow: 0 0 8px #fff700; min-height: 20px; }

        #historial { position: relative; z-index: 2; width: 340px; margin-top: 25px; background: rgba(10, 10, 20, 0.55); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); }
        #historial h3 { margin-top: 0; font-size: 16px; text-shadow: 0 0 8px #00f0ff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.15); }
        th { color: #00f0ff; text-transform: uppercase; font-size: 11px; }
        .estadoOn { color: #00ffb3; font-weight: bold; }
        .estadoOff { color: #ff6688; font-weight: bold; }
        #historialBody { display: block; max-height: 160px; overflow-y: auto; }
        #historialBody tr { display: table; width: 100%; table-layout: fixed; }
        #limpiarBtn { margin-top: 12px; width: 100%; height: 38px; font-size: 13px; background: rgba(255,255,255,0.1); box-shadow: none; animation: none; border: 1px solid rgba(255,255,255,0.2); }

        @media (max-width: 400px) { #appTitle { font-size: 38px; } }
    </style>
</head>
<body>

<!-- Pantalla de PIN -->
<div id="loginOverlay">
    <div class="loginBox">
        <h2>🔒 Acceso</h2>
        <p style="font-size:14px; opacity:0.8;">Ingresa el PIN para controlar el LED</p>
        <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
        <div id="loginError"></div>
        <button onclick="verificarPin()">Ingresar</button>
    </div>
</div>

<h1 id="appTitle">PY-CURITY</h1>
<p id="appSubtitle">SEGURIDAD INTELIGENTE PARA BICICLETAS • SISTEMA IoT</p>

<div class="card">
    <h1>🚲 Control PY-CURITY ⚡</h1>
    <svg id="bombillo" class="apagado" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <circle class="vidrio" cx="32" cy="26" r="18" fill="#555"/>
        <rect x="24" y="42" width="16" height="6" rx="2" fill="#888"/>
        <rect x="26" y="49" width="12" height="4" rx="1" fill="#888"/>
        <path d="M32 14 L32 26 M24 26 L40 26 M26 20 L38 20" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <button class="on" onclick="encender()">🔥 BLOQUEAR BICI</button><br>
    <button class="off" onclick="apagar()">💥 DESBLOQUEAR BICI</button>
    <div id="estado">Iniciando sistema...</div>
</div>

<div id="historial">
    <h3>📜 Historial de eventos</h3>
    <table>
        <thead><tr><th>Fecha / Hora</th><th>Dispositivo</th><th>Estado</th></tr></thead>
        <tbody id="historialBody"></tbody>
    </table>
    <button id="limpiarBtn" onclick="limpiarHistorial()">Limpiar historial</button>
</div>

<script type="module">
// =====================================================================
// 1. FUNCIONES PRINCIPALES Y DE SEGURIDAD (Se cargan primero para evitar bloqueos)
// =====================================================================
const PIN_CORRECTO = "1234"; 

window.verificarPin = function() {
    const input = document.getElementById("pinInput");
    const valor = input.value.trim(); // Evita errores si se teclea un espacio al final
    if (valor === PIN_CORRECTO) {
        document.getElementById("loginOverlay").style.display = "none";
    } else {
        document.getElementById("loginError").innerHTML = "PIN incorrecto, intenta de nuevo";
        input.value = "";
    }
};

// Permite usar la tecla "Enter" en el input del PIN
document.getElementById("pinInput").addEventListener("keyup", function(e){
    if (e.key === "Enter") window.verificarPin();
});

window.encender = function() { enviar("1"); };
window.apagar = function() { enviar("0"); };
window.limpiarHistorial = function() {
    localStorage.removeItem("historialLED");
    document.getElementById("historialBody").innerHTML = "";
};

// =====================================================================
// 2. LÓGICA DE CONTROL (Manejo del Bombillo y Envío MQTT)
// =====================================================================
let cliente = null;
const CLAVE_HISTORIAL = "historialLED";

function enviar(valor){
    if (cliente && cliente.connected) {
        cliente.publish("py-curity/cicla", valor);
        document.getElementById("estado").innerHTML = "Enviado: " + valor;
    } else {
        document.getElementById("estado").innerHTML = "⚠️ Ejecutado sin red: " + valor;
    }
    actualizarBombillo(valor);
    guardarEvento(valor);
}

function actualizarBombillo(valor){
    const bombillo = document.getElementById("bombillo");
    const vidrio = bombillo.querySelector(".vidrio");
    if (valor === "1") {
        bombillo.classList.replace("apagado", "encendido");
        vidrio.setAttribute("fill", "#fff700");
    } else {
        bombillo.classList.replace("encendido", "apagado");
        vidrio.setAttribute("fill", "#555");
    }
}

// =====================================================================
// 3. GENERACIÓN DE PARTÍCULAS DE FONDO
// =====================================================================
const colores = ["#ff00e6", "#00f0ff", "#fff700", "#7000ff", "#00ffb3"];
for (let i = 0; i < 25; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    const size = Math.random() * 12 + 4;
    p.style.width = size + "px"; p.style.height = size + "px";
    p.style.top = Math.random() * 100 + "vh"; p.style.left = Math.random() * 100 + "vw";
    p.style.background = colores[Math.floor(Math.random() * colores.length)];
    p.style.boxShadow = "0 0 10px " + p.style.background;
    p.style.animationDuration = (Math.random() * 6 + 5) + "s";
    p.style.animationDelay = (Math.random() * 5) + "s";
    document.body.appendChild(p);
}

// Identificador único
let deviceId = localStorage.getItem("pycurityDeviceId");
if (!deviceId) {
    deviceId = "DEV-" + crypto.randomUUID().slice(0, 8).toUpperCase();
    localStorage.setItem("pycurityDeviceId", deviceId);
}

// =====================================================================
// 4. HISTORIAL LOCAL
// =====================================================================
function guardarEvento(valor){
    const evento = {
        estado: valor === "1" ? "Encendido" : "Apagado",
        valor: valor,
        dispositivo: deviceId,
        fecha: new Date().toISOString(),
        timestamp: Date.now()
    };
    const local = JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || "[]");
    local.unshift(evento);
    localStorage.setItem(CLAVE_HISTORIAL, JSON.stringify(local.slice(0, 50)));
    renderizarHistorial(local);
}

function renderizarHistorial(historial){
    const cuerpo = document.getElementById("historialBody");
    cuerpo.innerHTML = "";
    historial.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 50).forEach(evento => {
        const fila = document.createElement("tr");
        const fecha = evento.fecha ? new Date(evento.fecha).toLocaleString("es-CO") : "";
        const encendido = evento.valor === "1" || evento.estado === "Encendido";
        fila.innerHTML = `<td>${fecha}</td><td>${evento.dispositivo || "Dispositivo"}</td><td class="${encendido ? "estadoOn" : "estadoOff"}">${encendido ? "Encendido" : "Apagado"}</td>`;
        cuerpo.appendChild(fila);
    });
}
renderizarHistorial(JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || "[]"));

// =====================================================================
// 5. INICIALIZACIÓN DE REDES (MQTT Y FIREBASE) - Manejado con Try/Catch
// =====================================================================
try {
    if (typeof mqtt !== "undefined") {
        cliente = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
        cliente.on("connect", () => document.getElementById("estado").innerHTML = "MQTT conectado ✅");
        cliente.on("error", () => document.getElementById("estado").innerHTML = "Error MQTT ❌");
    } else {
        document.getElementById("estado").innerHTML = "Librería MQTT bloqueada ❌";
    }
} catch (e) {
    console.error("Fallo general de MQTT", e);
}

// Importaciones de Firebase (Al final para que si fallan no rompan lo demás)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

try {
    const firebaseConfig = {
        apiKey: "PEGA_AQUI_TU_API_KEY",
        databaseURL: "PEGA_AQUI_TU_DATABASE_URL" // Si este enlace no es válido, Firebase tumba el código
    };
    
    // Solo inicia Firebase si el usuario configuró una URL real que empiece por "http"
    if (firebaseConfig.databaseURL.startsWith("http")) {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        onValue(query(ref(db, "pycurity/historial"), limitToLast(100)), snapshot => {
            const datos = [];
            snapshot.forEach(child => datos.push(child.val()));
            renderizarHistorial(datos);
        });
    } else {
        console.warn("Base de datos en modo local (Firebase sin configurar)");
    }
} catch (e) { 
    console.error("Error iniciando Firebase:", e); 
}
</script>
</body>
</html>
